[project]
name = "marketplace"
version = "0.1.0"
description = ""
authors = [
    {name = "Andrey Akinin",email = "akininandrej007@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.116.1,<0.117.0)",
    "sqlalchemy (>=2.0.41,<3.0.0)",
    "uvicorn[standard] (>=0.35.0,<0.36.0)",
    "alembic (>=1.16.4,<2.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "celery (>=5.5.3,<6.0.0)",
    "pytest (>=8.4.1,<9.0.0)",
    "pytest-asyncio (>=1.1.0,<2.0.0)",
    "ruff (>=0.12.4,<0.13.0)",
    "pre-commit (>=4.2.0,<5.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "boto3 (>=1.39.9,<2.0.0)",
    "psycopg2 (>=2.9.10,<3.0.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "greenlet (>=3.2.3,<4.0.0)",
    "bcrypt (==4.0.1)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# Указываем версию Python проекта
target-version = "py312"

# Максимальная длина строки (совместим с black)
line-length = 88

# Какие правила включать (по группам)
select = [
  "E",  # pycodestyle (PEP8)
  "F",  # pyflakes (ошибки, неиспользуемые переменные)
  "I",  # isort (сортировка импортов)
  "B",  # flake8-bugbear (ошибки дизайна)
  "S",  # bandit (безопасность)
  "T20",  # flake8-print (печать в проде)
  "UP",  # pyupgrade (советы по синтаксису)
]

# Какие правила игнорировать
ignore = [
  "B008",  # не проверять передачу mutable default аргументов
  "S101",
  "S310",
]

# Файлы и папки, которые исключаем из анализа
exclude = [
  ".venv",
  "__pycache__",
  "migrations",
  ".git",
  "settings.py",
  "versions"
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
