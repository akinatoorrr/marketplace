[project]
name = "marketplace"
version = "0.1.0"
description = ""
authors = [
    {name = "Andrey Akinin",email = "akininandrej007@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.116.1,<0.117.0)",
    "sqlalchemy[mypy] (>=2.0.43,<3.0.0)",
    "uvicorn[standard] (>=0.35.0,<0.36.0)",
    "alembic (>=1.16.4,<2.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "celery (>=5.5.3,<6.0.0)",
    "pytest (>=8.4.1,<9.0.0)",
    "pytest-asyncio (>=1.1.0,<2.0.0)",
    "ruff (>=0.12.4,<0.13.0)",
    "pre-commit (>=4.2.0,<5.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "boto3 (>=1.39.9,<2.0.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "greenlet (>=3.2.3,<4.0.0)",
    "bcrypt (==4.0.1)",
    "kombu[pyamqp] (>=5.5.4,<6.0.0)",
    "aiosmtplib (>=4.0.1,<5.0.0)",
    "email-validator (>=2.2.0,<3.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-cov (>=6.2.1,<7.0.0)",
    "mypy (>=1.17.1,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"

line-length = 88

select = [
  "E",
  "F",
  "I",
  "B",
  "S",
  "T20",
  "UP",
]

# Какие правила игнорировать
ignore = [
  "B008",
  "S101",
  "S310",
]

# Файлы и папки, которые исключаем из анализа
exclude = [
  ".venv",
  "__pycache__",
  "migrations",
  ".git",
  "settings.py",
  "versions"
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.pytest.ini_options]
pythonpath = ["src"]
norecursedirs = 'env/* venv/* ruff_cache/* alembic/*'
testpaths = 'tests/'
python_files = 'test_*.py'
addopts = "-ra --strict-markers -v"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_any_unimported = false
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
files = ["src"]
exclude = "tests/|alembic/|src/app/db/models/|src/app/db/test_sessions/"

plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
